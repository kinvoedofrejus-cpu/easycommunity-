<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyCommunity — Générateur de clé de licence (usage privé)</title>
<style>
  body{margin:0;font-family:'Segoe UI',Inter,system-ui,sans-serif;background:#0F172A;color:#E2E8F0;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{max-width:420px;width:100%;background:#1E293B;border-radius:18px;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.4);}
  h1{font-size:16px;margin:0 0 4px;}
  .warn{background:#7C2D12;color:#FED7AA;font-size:11.5px;padding:10px 12px;border-radius:10px;margin:14px 0 20px;line-height:1.5;}
  label{display:block;font-size:11.5px;font-weight:700;color:#94A3B8;margin-bottom:5px;margin-top:14px;}
  input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #334155;background:#0F172A;color:#E2E8F0;font-size:14px;box-sizing:border-box;}
  button{width:100%;margin-top:18px;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#1E56B0,#4CAF3E);
    color:#fff;font-weight:700;font-size:14px;cursor:pointer;}
  #result{margin-top:18px;display:none;}
  #keyOut{width:100%;padding:12px;border-radius:9px;border:1px solid #334155;background:#0F172A;color:#4ADE80;
    font-family:monospace;font-size:13px;word-break:break-all;box-sizing:border-box;}
  #copyBtn{background:#334155;margin-top:8px;}
  .err{color:#FCA5A5;font-size:12.5px;margin-top:10px;display:none;}
</style>
</head>
<body>
<div class="card">
  <h1>🔑 Générateur de clé de licence</h1>
  <div class="warn">⚠️ Usage privé uniquement. Ne jamais mettre ce fichier en ligne (GitHub, site web...) ni le partager avec vos clients — seule la clé générée doit leur être transmise, jamais ce fichier.</div>

  <label>Date d'expiration de l'abonnement</label>
  <input type="date" id="expiry">

  <button onclick="generate()">Générer la clé</button>
  <div class="err" id="err"></div>

  <div id="result">
    <label>Clé à transmettre à l'administrateur de l'association</label>
    <div id="keyOut"></div>
    <button id="copyBtn" onclick="copyKey()">Copier la clé</button>
  </div>
</div>

<script>
// DOIT être strictement identique à la constante LICENSE_SECRET de worker.js
const LICENSE_SECRET = "9666b32428b6edb941e4b1d556ca33997f8f3d6f584f4ac9b7ab3e32dd459ab2";

async function hmacHex(secret, message) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const sigBuf = await crypto.subtle.sign("HMAC", key, enc.encode(message));
  return Array.from(new Uint8Array(sigBuf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function generate(){
  const err = document.getElementById('err');
  err.style.display = 'none';
  const expiry = document.getElementById('expiry').value;
  if (!expiry){ err.textContent = "Choisissez une date d'expiration."; err.style.display='block'; return; }
  if (!crypto.subtle){ err.textContent = "Votre navigateur ne supporte pas le chiffrement nécessaire. Ouvrez ce fichier avec Chrome."; err.style.display='block'; return; }
  const sig = (await hmacHex(LICENSE_SECRET, expiry)).slice(0, 20);
  const key = `${expiry}.${sig}`;
  document.getElementById('keyOut').textContent = key;
  document.getElementById('result').style.display = 'block';
}
function copyKey(){
  const text = document.getElementById('keyOut').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    const old = btn.textContent; btn.textContent = "Copié ✓";
    setTimeout(() => btn.textContent = old, 1500);
  });
}
</script>
</body>
</html>
